name: IndexNow

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for IndexNow key file
        env:
          KEY_URL: https://gangnam-massage-5fy.pages.dev/e926d9ebeec34dd196aee0797ea4bf3d.txt
        run: |
          for i in {1..30}; do
            if curl --fail --silent "$KEY_URL" | grep -q "e926d9ebeec34dd196aee0797ea4bf3d"; then
              echo "IndexNow key file is live."
              exit 0
            fi
            echo "Waiting for Pages deployment..."
            sleep 10
          done
          echo "IndexNow key file did not become available in time."
          exit 1

      - name: Submit updated URLs
        env:
          SITE_URL: https://gangnam-massage-5fy.pages.dev/
          INDEXNOW_KEY: e926d9ebeec34dd196aee0797ea4bf3d
        run: npm run indexnow
